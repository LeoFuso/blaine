# Declarative example only. No values; no provider login performed.
[project]
name = "blaine-local"
revision = "1.0"

[providers]
keyring = "keyring://"

[providers.bitwarden]
# Replace nil UUID with the existing BWS project UUID (non-secret metadata).
# Adjust the server hostname if the existing project is not in the US region.
uri = "bws://00000000-0000-0000-0000-000000000000"
credentials = { access_token = "keyring" }

[profiles.default]
# ref.item must match existing BWS key names; do not create/migrate keys to fit this file.
MIRIX_PG_URI = { description = "Existing native PostgreSQL connection URI", required = true, providers = ["bitwarden"], ref = { item = "REPLACE_WITH_EXISTING_PG_URI_KEY" } }
MIRIX_REDIS_URI = { description = "Existing native Redis connection URI", required = true, providers = ["bitwarden"], ref = { item = "REPLACE_WITH_EXISTING_REDIS_URI_KEY" } }

[scopes.mirix]
secrets = ["MIRIX_PG_URI", "MIRIX_REDIS_URI"]
