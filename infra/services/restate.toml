# Stable adoption of the retained D2 native journal, never a parallel probe.
cluster-name = "blaine-d2"
node-name = "d2"
base-dir = "/home/leofuso/.local/share/blaine/runtime/restate-data"
bind-ip = "127.0.0.1"
bind-port = 45122
advertised-host = "127.0.0.1"
