# D2-only private deployment. Never share data/ports with a legacy probe or D1.
cluster-name = "blaine-personal"
node-name = "personal"
base-dir = ".local/d2/restate-data"
bind-ip = "127.0.0.1"
bind-port = 45122
advertised-host = "127.0.0.1"
listen-mode = "tcp"
auto-provision = true
default-journal-retention = "7 days"
[admin]
bind-address = "127.0.0.1:49070"
[ingress]
bind-address = "127.0.0.1:48080"
