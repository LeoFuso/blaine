name: Client prerelease
on:
  push:
    tags: ['v0.*-alpha.*']
permissions:
  contents: read
concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  client:
    uses: ./.github/workflows/client-build.yml
    permissions:
      contents: read
  publish:
    needs: client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blaine-*
          merge-multiple: true
          path: payload
      - name: Verify and publish the alpha assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.[1-9][0-9]*$ ]]
          cd payload
          sha256sum --check checksums.txt
          python3 -c 'from pathlib import Path; assert {p.name for p in Path(".").iterdir()} == {"blaine-linux-amd64", "blaine-linux-arm64", "blaine-darwin-amd64", "blaine-darwin-arm64", "checksums.txt"}'
          cat > "$RUNNER_TEMP/client-release-notes.md" <<'NOTES'
          Alpha workstation-client candidate. E0 and the Blaine client are not stable or accepted.

          Includes E0.A/B and the partial E0.C profile/transport/handshake/framing candidate. Production trusted peer binding, host dispatch/deployment and real remote ACP acceptance remain pending. MIRIX dependency readiness remains unknown. No E0.D+ capabilities are enabled.

          Assets: Linux amd64/arm64 and Darwin amd64/arm64. Windows+WSL2 uses the Linux client; no native Windows binary. Build verification is not macOS/WSL live acceptance. No macOS signing/notarization is claimed.

          Download your binary and checksums.txt, verify SHA-256, then install as ~/.local/bin/blaine. See client/INSTALL.md at this tag. Checksums provide integrity; GitHub artifact attestations and changie automation are deferred hardening/follow-up work.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --prerelease --latest=false \
            --title "Blaine client $GITHUB_REF_NAME (alpha)" \
            --notes-file "$RUNNER_TEMP/client-release-notes.md" \
            blaine-linux-amd64 blaine-linux-arm64 blaine-darwin-amd64 blaine-darwin-arm64 checksums.txt
